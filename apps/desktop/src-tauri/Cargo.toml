[package]
name = "graphnosis-app"
version = "1.32.0"
description = "Graphnosis — personal second memory"
authors = ["Nehloo Interactive LLC"]
# Custom string — FSL-1.1-Apache-2.0 isn't a registered SPDX id (yet),
# but Cargo accepts any string here. crates.io would warn, but we don't
# publish this crate; it ships as the Tauri shell binary only.
license = "FSL-1.1-Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "graphnosis_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "graphnosis-app"
path = "src/main.rs"

[features]
# Enable for signed release builds to use the macOS Keychain instead of the
# 0600 file cache. Add `--features keychain` to the `cargo tauri build` invocation
# in CI / the release pipeline. Dev builds leave this off — the file cache is
# simpler and avoids macOS Keychain audit-token rejections on unsigned binaries.
keychain = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
# HTTP client for remote-cortex ("thin-client") mode — the shell talks to a
# remote sidecar's httpUi bridge (/api/unlock, /api/rpc, /api/events) instead
# of a local Unix socket. Already built transitively via tauri-plugin-updater
# (same rustls stack), so making it a direct dep adds negligible compile cost.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
# Persists window size, position, maximize, and fullscreen state across
# launches. State lives in <app-data>/.window-state.json — written on
# move/resize/close, restored automatically on window creation.
tauri-plugin-window-state = "2"
keyring = "3"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# macOS-only: hardened Secure-Enclave storage for the remote access token
# (Touch ID unlock of a remote cortex). Exercised only on `--features keychain`
# signed builds. All three are already present transitively (via keyring/tauri),
# so promoting them to direct deps adds ~zero build cost.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# OSX_10_15 exposes kSecUseDataProtectionKeychain — required so the biometric
# access control is enforced by the Secure Enclave (data-protection keychain),
# not the legacy file keychain.
security-framework-sys = { version = "2", features = ["OSX_10_15"] }
core-foundation = "0.10"
