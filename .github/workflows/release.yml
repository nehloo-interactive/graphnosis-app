name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.14.2)'
        required: true

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      semver: ${{ steps.meta.outputs.semver }}
      dmg: ${{ steps.release.outputs.dmg_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check version consistency
        # v1.27.0 and v1.27.1 shipped with apps/desktop/package.json left at
        # 1.26.0 while tauri.conf.json said 1.27.x. Vite injects __APP_VERSION__
        # from that package.json, so both releases *displayed* the old version in
        # the UI — after an incident fix, users could not tell whether they had
        # actually received it. Nothing else catches this: the binary, installer
        # filename, and updater manifest all come from tauri.conf.json and were
        # perfectly correct.
        run: |
          CANON=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "canonical version (tauri.conf.json): $CANON"
          FAILED=0

          # Every file that must track the release version. The repo-root
          # package.json is intentionally excluded: it is the workspace manifest
          # and has deliberately stayed at its own version across releases.
          for f in apps/desktop/package.json apps/desktop-sidecar/package.json; do
            V=$(node -p "require('./$f').version")
            if [ "$V" != "$CANON" ]; then
              echo "::error::$f is $V but tauri.conf.json is $CANON"
              FAILED=1
            else
              echo "$f: $V — OK"
            fi
          done

          # The tag being built must match too, so a mis-tagged release cannot
          # publish under the wrong number.
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$CANON" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $CANON"
              FAILED=1
            else
              echo "tag $GITHUB_REF_NAME matches $CANON — OK"
            fi
          fi

          [ "$FAILED" -eq 0 ] || { echo "Version consistency check FAILED — refusing to build."; exit 1; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @graphnosis-app/core build

      - name: Build signed demo .gsk packs
        env:
          GSK_SIGNING_KEY_HEX: ${{ secrets.GSK_SIGNING_KEY_HEX }}
        run: |
          if [ -z "$GSK_SIGNING_KEY_HEX" ]; then
            echo "ERROR: GSK_SIGNING_KEY_HEX secret is not set."
            echo "Generate the keypair locally with scripts/gen-gsk-keypair.mjs,"
            echo "then add the 64-byte hex secret as a repo Actions secret."
            exit 1
          fi
          node scripts/build-gsk.mjs --sign

      - name: Build sidecar
        run: pnpm --filter @graphnosis-app/desktop-sidecar build

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Stage libonnxruntime for signing
        run: |
          DYLIB="libonnxruntime.1.21.0.dylib"
          DEST="apps/desktop/src-tauri/resources/$DYLIB"
          mkdir -p "$(dirname "$DEST")"
          SRC=$(find node_modules/.pnpm -path "*/darwin/arm64/$DYLIB" | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: $DYLIB not found in node_modules/.pnpm" && exit 1
          fi
          cp "$SRC" "$DEST"
          echo "Staged $SRC → $DEST"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Sign libonnxruntime
        run: |
          codesign --force --sign "Developer ID Application: Nehloo Interactive LLC (C76ZLJ5UQW)" \
            --options runtime --timestamp \
            apps/desktop/src-tauri/resources/libonnxruntime.1.21.0.dylib

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        # keychain-access-groups (the Secure-Enclave biometry gate) is a
        # RESTRICTED entitlement: on Developer-ID macOS the binary carrying it
        # needs an embedded provisioning profile, or AMFI SIGKILLs it at launch.
        run: |
          if [ -z "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::APPLE_PROVISIONING_PROFILE_BASE64 secret is not set."
            exit 1
          fi
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o apps/desktop/src-tauri/embedded.provisionprofile
          echo "Wrote $(wc -c < apps/desktop/src-tauri/embedded.provisionprofile) bytes"

      # ── Secure-Enclave signing, in four parts ────────────────────────────────
      #
      # Tauri applies ONE entitlements file to EVERY binary it bundles. The SE
      # entitlement is restricted and only the outer .app has a profile
      # authorizing it, so granting it bundle-wide gets the helper binaries
      # SIGKILLed (this is exactly what broke v1.27.0).
      #
      # So: let Tauri sign everything with the clean entitlements file, then
      # re-sign ONLY the outer app with the restricted one. Re-signing the outer
      # bundle does not touch the helper binaries' own signatures, but it DOES
      # invalidate the notarization ticket, the DMG, and the updater tarball —
      # all of which Tauri derives from the signed app. Hence we build the .app
      # alone here and produce the DMG + updater artifacts ourselves afterwards.
      - name: Build app bundle (unnotarized)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        # APPLE_ID / APPLE_PASSWORD are deliberately NOT passed: notarizing here
        # would be wasted work, since the re-sign below invalidates the ticket.
        #
        # "dmg" is included even though the DMG produced here is discarded and
        # rebuilt after the re-sign: Tauri only emits its bundle_dmg.sh helper as
        # part of the dmg target, and the rebuild step depends on that script to
        # keep the installer window identical to previous releases.
        #
        # `exec tauri build …` rather than `tauri:build -- …`: the latter expands
        # to `tauri build -- <flags>`, and that `--` makes Tauri forward
        # everything after it to cargo. `--features` survives that (cargo has one
        # too) but `--bundles` is Tauri-only, so cargo rejects it outright.
        run: pnpm --filter @graphnosis-app/desktop exec tauri build --features keychain --bundles app,dmg

      - name: Re-sign app with Secure-Enclave entitlement
        run: |
          APP="apps/desktop/src-tauri/target/release/bundle/macos/Graphnosis.app"
          IDENTITY="Developer ID Application: Nehloo Interactive LLC (C76ZLJ5UQW)"

          # Tauri's bundle.macOS.files already places the profile in Contents/;
          # copy defensively in case that mapping is ever dropped.
          cp -f apps/desktop/src-tauri/embedded.provisionprofile \
                "$APP/Contents/embedded.provisionprofile"

          codesign --force --sign "$IDENTITY" \
            --entitlements apps/desktop/src-tauri/entitlements.app.plist \
            --options runtime --timestamp "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify bundled binaries actually launch
        # Release gate. v1.27.0 shipped a bundle whose helper binaries carried a
        # restricted entitlement they had no provisioning profile for; AMFI
        # SIGKILLed them (exit 137) the moment the app spawned the sidecar, so
        # every install failed at startup with "Synapse exited unexpectedly".
        # codesign --verify and notarization BOTH pass on such a bundle — the
        # only thing that catches it is executing the binaries. Do that here.
        run: |
          APP="apps/desktop/src-tauri/target/release/bundle/macos/Graphnosis.app"
          FAILED=0

          for BIN in graphnosis-sidecar graphnosis-mcp-relay; do
            # Copy out of the bundle so a crash can't disturb the artifact.
            cp "$APP/Contents/MacOS/$BIN" "$RUNNER_TEMP/$BIN-probe"
            set +e
            "$RUNNER_TEMP/$BIN-probe" --version >"$RUNNER_TEMP/$BIN.log" 2>&1
            RC=$?
            set -e
            # 137 = 128+9 = SIGKILL, i.e. the OS refused to run it.
            if [ "$RC" -eq 137 ]; then
              echo "::error::$BIN was SIGKILLed on launch (exit 137) — the bundle is unlaunchable."
              echo "--- entitlements on $BIN ---"
              codesign -d --entitlements :- "$APP/Contents/MacOS/$BIN" 2>&1 || true
              FAILED=1
            else
              echo "$BIN: launched (exit $RC) — OK"
            fi
          done

          # Restricted entitlements on helper binaries are the known root cause;
          # fail loudly even if the probe above somehow passed.
          for BIN in graphnosis-sidecar graphnosis-mcp-relay graphnosis-biometric; do
            if codesign -d --entitlements :- "$APP/Contents/MacOS/$BIN" 2>/dev/null \
                 | grep -q "keychain-access-groups"; then
              echo "::error::$BIN carries the restricted keychain-access-groups entitlement."
              echo "Helper binaries have no provisioning profile — this will be SIGKILLed at runtime."
              FAILED=1
            fi
          done

          # Positive check: the outer app MUST carry the SE entitlement and the
          # profile authorizing it. Without this, a silent regression to the
          # soft token path would ship looking perfectly healthy.
          if ! codesign -d --entitlements :- "$APP/Contents/MacOS/graphnosis-app" 2>/dev/null \
               | grep -q "keychain-access-groups"; then
            echo "::error::graphnosis-app is MISSING keychain-access-groups — Secure Enclave would silently fall back."
            FAILED=1
          fi
          if [ ! -f "$APP/Contents/embedded.provisionprofile" ]; then
            echo "::error::embedded.provisionprofile missing from the bundle — the app will be SIGKILLed at launch."
            FAILED=1
          fi

          # The app carries a restricted entitlement, so it is the binary most
          # likely to be refused by AMFI. It is a GUI app with no --version flag
          # and never exits on its own, so launch it detached and check only
          # whether the OS killed it: AMFI SIGKILLs happen instantly at exec.
          # A non-137 exit (e.g. no window server on a headless runner) is fine —
          # we are testing "was it allowed to run", not "did it open a window".
          "$APP/Contents/MacOS/graphnosis-app" >"$RUNNER_TEMP/app.log" 2>&1 &
          APP_PID=$!
          sleep 5
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "graphnosis-app: running after 5s — AMFI accepted the entitlement"
            kill "$APP_PID" 2>/dev/null || true
          else
            set +e; wait "$APP_PID"; APP_RC=$?; set -e
            if [ "$APP_RC" -eq 137 ]; then
              echo "::error::graphnosis-app was SIGKILLed (exit 137) — profile/entitlement mismatch."
              cat "$RUNNER_TEMP/app.log" || true
              FAILED=1
            else
              echo "graphnosis-app: exited $APP_RC (not SIGKILL) — entitlement accepted"
            fi
          fi

          [ "$FAILED" -eq 0 ] || { echo "Bundle verification FAILED — refusing to publish."; exit 1; }
          echo "All bundled binaries launch correctly; Secure-Enclave entitlement present."

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: C76ZLJ5UQW
        run: |
          APP="apps/desktop/src-tauri/target/release/bundle/macos/Graphnosis.app"
          ZIP="$RUNNER_TEMP/Graphnosis-notarize.zip"

          # ditto preserves the signature; `zip` does not.
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"

          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Build DMG
        run: |
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle"
          APP="$BUNDLE_DIR/macos/Graphnosis.app"
          SEMVER=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          DMG_DIR="$BUNDLE_DIR/dmg"
          DMG="$DMG_DIR/Graphnosis_${SEMVER}_aarch64.dmg"

          # Tauri emits its own bundle_dmg.sh; reusing it keeps the DMG window
          # layout identical to every previous release instead of hand-rolling
          # hdiutil and silently changing the install experience.
          if [ ! -f "$DMG_DIR/bundle_dmg.sh" ]; then
            echo "::error::bundle_dmg.sh not found — cannot build a DMG matching prior releases."
            exit 1
          fi

          # --skip-jenkins skips the Finder-prettifying AppleScript, which cannot
          # run without a GUI session (osascript fails with -1743). Tauri passes
          # this flag itself whenever CI is set, so every previous release DMG
          # was built this way too — matching it keeps the output identical.
          rm -f "$DMG"
          ( cd "$DMG_DIR" && ./bundle_dmg.sh \
              --volname "Graphnosis" \
              --icon "Graphnosis.app" 180 170 \
              --app-drop-link 480 170 \
              --window-size 660 400 \
              --hide-extension "Graphnosis.app" \
              --skip-jenkins \
              "$(basename "$DMG")" \
              "../macos/Graphnosis.app" )

          codesign --force --sign "Developer ID Application: Nehloo Interactive LLC (C76ZLJ5UQW)" \
            --timestamp "$DMG"
          echo "Built $DMG"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: C76ZLJ5UQW
        run: |
          SEMVER=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          DMG="apps/desktop/src-tauri/target/release/bundle/dmg/Graphnosis_${SEMVER}_aarch64.dmg"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Build updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key has no passphrase. Without this, `signer sign` tries
          # to prompt for one and dies on the runner's absent TTY with
          # "Device not configured (os error 6)".
          #
          # It has to be supplied through the environment, NOT as `--password ""`:
          # pnpm drops empty-string arguments when forwarding, so the flag would
          # swallow the file path as its value and leave no file to sign.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        # The tarball Tauri produced during the build wraps the pre-re-sign app,
        # so it must be rebuilt from the stapled bundle and re-signed, or the
        # updater would hand existing installs the unlaunchable version.
        run: |
          # ABSOLUTE path: `pnpm --filter <pkg> exec` runs with the working
          # directory set to that package (apps/desktop), so a repo-root-relative
          # path handed to the signer resolves to apps/desktop/apps/desktop/… and
          # the file is reported missing even though it was just created.
          BUNDLE_DIR="$PWD/apps/desktop/src-tauri/target/release/bundle/macos"
          TAR="$BUNDLE_DIR/Graphnosis.app.tar.gz"

          rm -f "$TAR" "$TAR.sig"
          ( cd "$BUNDLE_DIR" && /usr/bin/tar czf "Graphnosis.app.tar.gz" "Graphnosis.app" )

          pnpm --filter @graphnosis-app/desktop exec tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" "$TAR"

          [ -f "$TAR.sig" ] || { echo "::error::updater signature was not produced."; exit 1; }
          echo "Updater artifacts ready: $TAR (+ .sig)"

      - name: Derive version and DMG filename
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          SEMVER=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

      - name: Collect updater artifacts and generate latest.json
        id: updater
        run: |
          SEMVER="${{ steps.meta.outputs.semver }}"
          VERSION="${{ steps.meta.outputs.version }}"
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle/macos"

          TAR_SRC="${BUNDLE_DIR}/Graphnosis.app.tar.gz"
          SIG_SRC="${TAR_SRC}.sig"
          TAR_DEST="${BUNDLE_DIR}/Graphnosis_${SEMVER}_aarch64.app.tar.gz"

          if [ ! -f "$TAR_SRC" ]; then
            echo "ERROR: $TAR_SRC not found. Was TAURI_SIGNING_PRIVATE_KEY set?" && exit 1
          fi
          mv "$TAR_SRC" "$TAR_DEST"

          SIG=$(cat "$SIG_SRC")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << EOF
          {
            "version": "${SEMVER}",
            "notes": "See full changelog: https://github.com/nehloo-interactive/graphnosis-app/releases/tag/${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://github.com/nehloo-interactive/graphnosis-app/releases/download/${VERSION}/Graphnosis_${SEMVER}_aarch64.app.tar.gz"
              }
            }
          }
          EOF

          echo "tar_path=${TAR_DEST}" >> $GITHUB_OUTPUT

      - name: Create or update GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SEMVER="${{ steps.meta.outputs.semver }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAR_PATH="${{ steps.updater.outputs.tar_path }}"

          DMG_PATH=$(find apps/desktop/src-tauri/target -name "*.dmg" | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "ERROR: no .dmg found under apps/desktop/src-tauri/target" && exit 1
          fi
          echo "Found DMG: $DMG_PATH"
          echo "dmg_filename=$(basename "$DMG_PATH")" >> $GITHUB_OUTPUT

          if CREATE_OUT=$(gh release create "$VERSION" \
              "$DMG_PATH#Graphnosis ${VERSION} (macOS Apple Silicon)" \
              "latest.json" \
              --title "Graphnosis ${VERSION}" \
              --generate-notes 2>&1); then
            echo "Release created."
          elif echo "$CREATE_OUT" | grep -qi "already exists"; then
            echo "Release already exists — uploading artifacts."
            gh release upload "$VERSION" \
              "$DMG_PATH#Graphnosis ${VERSION} (macOS Apple Silicon)" \
              "latest.json" \
              --clobber
          else
            echo "$CREATE_OUT" >&2 && exit 1
          fi
          gh release upload "$VERSION" \
            "$TAR_PATH#Graphnosis ${VERSION} — Auto-Update bundle" \
            --clobber || echo "::warning::Auto-update bundle upload failed — re-upload the .app.tar.gz manually if needed."

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain || true

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    needs: build-mac
    permissions:
      contents: write
      id-token: write
    outputs:
      msi: ${{ steps.find.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace core package
        run: pnpm --filter @graphnosis-app/core build

      - name: Build signed demo .gsk packs
        shell: pwsh
        env:
          GSK_SIGNING_KEY_HEX: ${{ secrets.GSK_SIGNING_KEY_HEX }}
        run: |
          if (-not $env:GSK_SIGNING_KEY_HEX) {
            Write-Error "GSK_SIGNING_KEY_HEX secret is not set."
            exit 1
          }
          node scripts/build-gsk.mjs --sign

      - name: Build sidecar
        run: pnpm --filter @graphnosis-app/desktop-sidecar build

      - name: Stage onnxruntime.dll (optional)
        shell: pwsh
        run: |
          $dest = "apps/desktop/src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $dll = Get-ChildItem -Recurse -Filter "onnxruntime.dll" node_modules/.pnpm `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "win32.x64" } |
            Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName "$dest/onnxruntime.dll"
            Write-Host "Staged $($dll.FullName) -> $dest/onnxruntime.dll"
          } else {
            Write-Warning "onnxruntime.dll not found — embeddings will use TF-IDF fallback"
          }

      - name: Build (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm --filter @graphnosis-app/desktop tauri:build

      - name: Ensure PSGallery is registered
        shell: powershell
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            try { Register-PSRepository -Default } catch { Write-Host "Register-PSRepository: $_" }
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Sign NSIS installer (Azure Artifact Signing)
        uses: azure/trusted-signing-action@v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: nehloo-trusted-signing
          certificate-profile-name: graphnosis-public
          files-folder: apps/desktop/src-tauri/target/release/bundle/nsis
          files-folder-filter: exe
          files-folder-recurse: false
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign MSI (Azure Artifact Signing)
        uses: azure/trusted-signing-action@v0.5.11
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: nehloo-trusted-signing
          certificate-profile-name: graphnosis-public
          files-folder: apps/desktop/src-tauri/target/release/bundle/msi
          files-folder-filter: msi
          files-folder-recurse: false
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Find MSI
        id: find
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse `
            apps/desktop/src-tauri/target/release/bundle/msi `
            -Filter "*.msi" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msi) {
            Write-Error "No MSI found in bundle/msi output"
            exit 1
          }
          echo "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($msi.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload MSI to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ needs.build-mac.outputs.version }}" `
            "${{ steps.find.outputs.path }}" --clobber

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: build-mac
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Tauri v2 Linux build dependencies (webkit2gtk 4.1) + patchelf for the
      # AppImage. Built on 22.04 (not latest) for the widest glibc compatibility
      # of the resulting AppImage.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable, x86_64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Required by src-tauri/build.rs, which bun-compiles the sidecar + MCP
      # relay for the linux target during `cargo build` (maps
      # x86_64-unknown-linux-gnu -> bun-linux-x64) and stages the linux
      # onnxruntime .so into resources/.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace core package
        run: pnpm --filter @graphnosis-app/core build

      - name: Build signed demo .gsk packs
        env:
          GSK_SIGNING_KEY_HEX: ${{ secrets.GSK_SIGNING_KEY_HEX }}
        run: |
          if [ -z "$GSK_SIGNING_KEY_HEX" ]; then
            echo "ERROR: GSK_SIGNING_KEY_HEX secret is not set." && exit 1
          fi
          node scripts/build-gsk.mjs --sign

      - name: Build sidecar
        run: pnpm --filter @graphnosis-app/desktop-sidecar build

      # linuxdeploy runs ldd on every usr/bin ELF and dies if ldd fails. Our Bun
      # --compile sidecars (graphnosis-sidecar/-mcp-relay) are self-contained and
      # ldd can't trace them (exits 1) — they link only standard glibc, so they
      # need no dep bundling. Shim ldd to report "no deps" when the real ldd
      # fails, while passing normal binaries (the app → GTK/WebKit) through.
      - name: Install ldd shim for self-contained sidecars
        run: |
          mkdir -p "$HOME/.local/bin-shim"
          cat > "$HOME/.local/bin-shim/ldd" <<'SH'
          #!/usr/bin/env bash
          out=$(/usr/bin/ldd "$@" 2>&1); rc=$?
          if [ $rc -ne 0 ]; then exit 0; fi
          printf '%s\n' "$out"
          SH
          chmod +x "$HOME/.local/bin-shim/ldd"
          echo "$HOME/.local/bin-shim" >> "$GITHUB_PATH"

      # tauri.linux.conf.json selects the deb + appimage bundle targets and the
      # linux externalBin/resources (auto-merged by Tauri on the linux host).
      - name: Build (Linux deb + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # GitHub runners lack FUSE; extract-and-run instead of FUSE-mounting,
          # else AppImage bundling dies with "failed to run linuxdeploy".
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm --filter @graphnosis-app/desktop tauri:build

      - name: Upload Linux artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-mac.outputs.version }}"
          SEMVER="${VERSION#v}"
          BUNDLE="apps/desktop/src-tauri/target/release/bundle"
          APPIMAGE=$(find "$BUNDLE" -name "*.AppImage" | head -1)
          DEB=$(find "$BUNDLE" -name "*.deb" | head -1)
          if [ -z "$APPIMAGE" ] || [ -z "$DEB" ]; then
            echo "ERROR: AppImage or .deb not found under $BUNDLE"
            find "$BUNDLE" -maxdepth 2 -type f || true
            exit 1
          fi
          # Copy to canonical, predictable names so the static /download/linux
          # redirects resolve deterministically (Tauri tends to lowercase the
          # .deb package name; forcing the asset name sidesteps that).
          cp "$APPIMAGE" "Graphnosis_${SEMVER}_amd64.AppImage"
          cp "$DEB"      "Graphnosis_${SEMVER}_amd64.deb"
          gh release upload "$VERSION" \
            "Graphnosis_${SEMVER}_amd64.AppImage#Graphnosis ${VERSION} (Linux AppImage)" \
            "Graphnosis_${SEMVER}_amd64.deb#Graphnosis ${VERSION} (Linux .deb)" \
            --clobber

  # Waits for EVERY platform build before flipping the pointer.
  #
  # CURRENT_VERSION is global — it drives /download/mac, /download/win,
  # /download/linux and /download/linux-deb alike. Flipping it as soon as
  # build-mac finished meant the Linux and Windows links pointed at assets whose
  # builds were still running, so those downloads 404'd until they uploaded.
  # A few minutes of extra wait is worth never serving a broken download link.
  update-cloudflare-mac:
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows, build-linux]
    steps:
      - name: Update Cloudflare env vars (version + mac DMG)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ secrets.CF_PROJECT_NAME }}
        run: |
          curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_configs\": {
                \"production\": {
                  \"env_vars\": {
                    \"CURRENT_VERSION\": { \"value\": \"${{ needs.build-mac.outputs.version }}\" },
                    \"DMG_FILENAME\": { \"value\": \"${{ needs.build-mac.outputs.dmg }}\" },
                    \"PUBLIC_RELEASED_VERSION\": { \"value\": \"${{ needs.build-mac.outputs.version }}\" }
                  }
                }
              }
            }"

      - name: Trigger Cloudflare Pages redeploy
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ secrets.CF_PROJECT_NAME }}
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME/deployments" \
            -H "Authorization: Bearer $CF_API_TOKEN"

  # Runs as soon as build-windows succeeds — unblocks Windows downloads
  # independently of the mac job timing.
  # Intentionally sets CURRENT_VERSION + DMG_FILENAME too so this job is
  # fully self-contained: if update-cloudflare-mac failed or was skipped,
  # Windows users still get a working, consistent redirect.
  update-cloudflare-win:
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    steps:
      - name: Update Cloudflare env vars (version + DMG + Windows MSI)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ secrets.CF_PROJECT_NAME }}
        run: |
          curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_configs\": {
                \"production\": {
                  \"env_vars\": {
                    \"CURRENT_VERSION\": { \"value\": \"${{ needs.build-mac.outputs.version }}\" },
                    \"DMG_FILENAME\": { \"value\": \"${{ needs.build-mac.outputs.dmg }}\" },
                    \"PUBLIC_RELEASED_VERSION\": { \"value\": \"${{ needs.build-mac.outputs.version }}\" },
                    \"WINDOWS_FILENAME\": { \"value\": \"${{ needs.build-windows.outputs.msi }}\" }
                  }
                }
              }
            }"
