name: Linux Server

# Validates that the headless sidecar builds + runs on Linux (x64) and
# publishes a multi-arch Docker image for the personal-server deployment.
# Complements test.yml (which only covers macOS).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # onnxruntime links against the OpenMP runtime; sidecar boot exercises
      # embeddings, so the runner needs libgomp1 present.
      - name: Install native runtime libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace (core + sidecar + web UI)
        run: pnpm -r --filter '!@graphnosis-app/docs' --filter '!@graphnosis/mcp-relay' build

      - name: Guard — no committed smoketest fixtures
        run: |
          set -euo pipefail
          if git ls-files 'apps/desktop-sidecar/src/smoketest*.ts' 'apps/desktop-sidecar/dist/smoketest*.js' | grep -q .; then
            echo 'smoketest sources must stay local-only (gitignored); remove from index'
            git ls-files 'apps/desktop-sidecar/src/smoketest*.ts' 'apps/desktop-sidecar/dist/smoketest*.js'
            exit 1
          fi
          echo 'ok (no smoketest paths tracked)'

      - name: Guard — licence claims match the licences described
        # The README summarises licensing in prose, and prose drifts. It once
        # described a sibling library as Apache 2.0 when it had been FSL-1.1
        # since extraction — a public repo advertising more permission than the
        # licence grants. The LICENSE file, package manifest and Terms of Use
        # were all correct, so nothing contradicted the summary.
        #
        # Verifies sibling claims over the network and degrades to a warning
        # when that is unavailable; this repo's own claim is always enforced.
        run: node scripts/check-license-claims.mjs

      - name: HTTP UI server end-to-end
        # Boot the sidecar with the browser UI enabled against a throwaway
        # cortex, then assert /api/unlock + an authed RPC + static UI all work.
        run: |
          set -euo pipefail
          export GRAPHNOSIS_CORTEX="$RUNNER_TEMP/ci-cortex"
          export GRAPHNOSIS_PASSPHRASE="ci-pass"
          export GRAPHNOSIS_HTTP_UI=1
          export GRAPHNOSIS_HTTP_UI_PORT=3456
          export GRAPHNOSIS_HTTP_UI_TOKEN="ci-token"
          export GRAPHNOSIS_HTTP_UI_STATIC="$PWD/apps/desktop/dist"
          node apps/desktop-sidecar/dist/index.js & SID=$!
          # Wait for the UI server to bind (up to ~40s; embeddings init first).
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "http://127.0.0.1:3456/"; then break; fi
            sleep 1
          done
          # NOTE ON THE SHAPE OF THESE ASSERTIONS.
          #
          # They used to read `curl … | grep -q X && echo "ok"`. Under
          # `set -euo pipefail` that CANNOT FAIL: a command that fails as a
          # non-final member of an AND-OR list is exempt from errexit, so a
          # regression made grep return 1, `echo "ok"` was skipped, nothing was
          # printed, and the step went green. A silent assertion is worse than
          # no assertion, because the green check is read as evidence.
          #
          # Every check below is therefore an explicit `if ! …; then exit 1`.
          echo "— static UI —"
          if ! curl -fsS "http://127.0.0.1:3456/" | grep -q "<title"; then
            echo "::error::static UI did not serve an HTML document"; kill $SID 2>/dev/null || true; exit 1
          fi
          echo "ok"
          echo "— unlock —"
          SESSION=$(curl -fsS -X POST "http://127.0.0.1:3456/api/unlock" \
            -H 'Content-Type: application/json' -d '{"token":"ci-token"}' \
            | node -e "process.stdin.on('data',d=>{const j=JSON.parse(d);if(!j.token)process.exit(1);process.stdout.write(j.token)})")
          echo "— authed rpc —"
          if ! curl -fsS -X POST "http://127.0.0.1:3456/api/rpc" \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $SESSION" \
            -d '{"method":"graphs.list","params":null}' | grep -q '"result"'; then
            echo "::error::authed RPC did not return a result"; kill $SID 2>/dev/null || true; exit 1
          fi
          echo "ok"

          # THE ONE NEGATIVE SECURITY ASSERTION IN THIS PIPELINE. It gates the
          # container publish below, so it has to be the strictest check here,
          # not the loosest.
          #
          # `curl -s` (not -f) is deliberate: a 401 is the expected response and
          # -f would make curl itself fail on it. The consequence is that a
          # connection failure yields an empty body and code `000`, so the check
          # must reject anything that is not exactly 401 rather than accept
          # anything that is not 200.
          echo "— rejects bad token —"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:3456/api/rpc" \
            -H 'Content-Type: application/json' -H "Authorization: Bearer nope" \
            -d '{"method":"graphs.list","params":null}')
          if [ "$code" != "401" ]; then
            echo "::error::AUTH BYPASS — a bad bearer token got HTTP $code, expected 401."
            echo "::error::Refusing to publish. If this is 000 the server was unreachable, which is also a failure."
            kill $SID 2>/dev/null || true
            exit 1
          fi
          echo "ok (401)"
          kill $SID 2>/dev/null || true

  docker:
    name: Docker image (amd64 + arm64)
    needs: build-test
    # Don't push from PRs (no write to GHCR from forks; avoids junk tags).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/graphnosis-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
